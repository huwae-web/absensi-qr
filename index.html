<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi QR Code</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    
    <!-- Container Utama -->
    <div class="container mx-auto px-4 py-12">
        <div class="max-w-4xl mx-auto text-center">
            
            <!-- Header -->
            <h1 class="text-5xl font-bold text-indigo-700 mb-4">
                Sistem Absensi QR Code
            </h1>
            <p class="text-xl text-gray-600 mb-12">
                Sistem Absensi Kuliah Berbasis QR Code & GPS
            </p>
            
            <!-- Pilihan Role -->
            <div class="grid md:grid-cols-3 gap-6">
                
                <!-- Card Admin -->
                <div class="bg-white rounded-lg shadow-lg p-8 hover:shadow-xl transition-all duration-300 transform hover:-translate-y-2 cursor-pointer" onclick="location.href='pages/login-admin.html'">
                    <div class="text-6xl mb-4">👨‍💼</div>
                    <h2 class="text-2xl font-bold mb-2 text-gray-800">Admin</h2>
                    <p class="text-gray-600">Kelola persetujuan dosen</p>
                </div>
                
                <!-- Card Dosen -->
                <div class="bg-white rounded-lg shadow-lg p-8 hover:shadow-xl transition-all duration-300 transform hover:-translate-y-2 cursor-pointer" onclick="location.href='pages/login-dosen.html'">
                    <div class="text-6xl mb-4">👨‍🏫</div>
                    <h2 class="text-2xl font-bold mb-2 text-gray-800">Dosen</h2>
                    <p class="text-gray-600">Buat sesi & kelola absensi</p>
                </div>
                
                <!-- Card Mahasiswa -->
                <div class="bg-white rounded-lg shadow-lg p-8 hover:shadow-xl transition-all duration-300 transform hover:-translate-y-2 cursor-pointer" onclick="location.href='pages/login-mahasiswa.html'">
                    <div class="text-6xl mb-4">👨‍🎓</div>
                    <h2 class="text-2xl font-bold mb-2 text-gray-800">Mahasiswa</h2>
                    <p class="text-gray-600">Scan QR & cek kehadiran</p>
                </div>
                
            </div>
            
            <!-- Footer Info -->
            <div class="mt-12 text-gray-500 text-sm">
                <p>© 2025 Sistem Absensi QR Code | Validasi GPS & Waktu</p>
            </div>
            
        </div>
    </div>
    
    <!-- Initialize Storage -->
    <script src="js/storage.js"></script>
    <script>
        // Initialize admin saat pertama kali load
        initializeAdmin();
    </script>
    
</body>
</html>
