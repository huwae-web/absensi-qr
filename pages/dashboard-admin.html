<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Sistem Absensi</title>
    <link rel="stylesheet" href="../style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    
    <div class="container mx-auto px-4 py-8">
        
        <!-- Header -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6 fade-in">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-3xl font-bold text-gray-800">Dashboard Admin</h1>
                    <p class="text-gray-600 mt-1" id="adminName">Loading...</p>
                </div>
                <button onclick="logout()" class="btn-danger">
                    🚪 Logout
                </button>
            </div>
        </div>
        
        <!-- Stats Cards -->
        <div class="grid md:grid-cols-3 gap-6 mb-6">
            <div class="bg-white rounded-lg shadow-lg p-6 fade-in">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">Dosen Pending</p>
                        <p class="text-3xl font-bold text-yellow-600" id="pendingCount">0</p>
                    </div>
                    <div class="text-5xl">⏳</div>
                </div>
            </div>
            
            <div class="bg-white rounded-lg shadow-lg p-6 fade-in">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">Dosen Disetujui</p>
                        <p class="text-3xl font-bold text-green-600" id="approvedCount">0</p>
                    </div>
                    <div class="text-5xl">✅</div>
                </div>
            </div>
            
            <div class="bg-white rounded-lg shadow-lg p-6 fade-in">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">Total Mahasiswa</p>
                        <p class="text-3xl font-bold text-blue-600" id="mahasiswaCount">0</p>
                    </div>
                    <div class="text-5xl">👨‍🎓</div>
                </div>
            </div>
        </div>
        
        <!-- Tabs -->
        <div class="bg-white rounded-lg shadow-lg mb-6">
            <div class="border-b border-gray-200">
                <div class="flex">
                    <button 
                        class="px-6 py-4 font-semibold border-b-2 border-indigo-600 text-indigo-600"
                        id="tabPending"
                        onclick="switchTab('pending')"
                    >
                        Dosen Pending
                    </button>
                    <button 
                        class="px-6 py-4 font-semibold text-gray-500 hover:text-gray-700"
                        id="tabApproved"
                        onclick="switchTab('approved')"
                    >
                        Dosen Disetujui
                    </button>
                    <button 
                        class="px-6 py-4 font-semibold text-gray-500 hover:text-gray-700"
                        id="tabMahasiswa"
                        onclick="switchTab('mahasiswa')"
                    >
                        Daftar Mahasiswa
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Content Pending Dosen -->
        <div id="contentPending" class="bg-white rounded-lg shadow-lg p-6 fade-in">
            <h2 class="text-2xl font-bold mb-4">Persetujuan Dosen Pending</h2>
            <div id="pendingList"></div>
        </div>
        
        <!-- Content Approved Dosen -->
        <div id="contentApproved" class="bg-white rounded-lg shadow-lg p-6 fade-in hidden">
            <h2 class="text-2xl font-bold mb-4">Dosen yang Sudah Disetujui</h2>
            <div id="approvedList"></div>
        </div>
        
        <!-- Content Mahasiswa -->
        <div id="contentMahasiswa" class="bg-white rounded-lg shadow-lg p-6 fade-in hidden">
            <h2 class="text-2xl font-bold mb-4">Daftar Mahasiswa Terdaftar</h2>
            <div id="mahasiswaList"></div>
        </div>
        
    </div>
    
    <!-- Scripts -->
    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        let currentTab = 'pending';
        
        // Check authentication
        if (!requireAuth('admin')) {
            // Will redirect if not authenticated
        }
        
        // Display admin name
        const user = getCurrentUser();
        document.getElementById('adminName').textContent = `Selamat datang, ${user.username}`;
        
        // Switch Tab
        function switchTab(tab) {
            currentTab = tab;
            
            // Update tab buttons
            document.getElementById('tabPending').className = 'px-6 py-4 font-semibold text-gray-500 hover:text-gray-700';
            document.getElementById('tabApproved').className = 'px-6 py-4 font-semibold text-gray-500 hover:text-gray-700';
            document.getElementById('tabMahasiswa').className = 'px-6 py-4 font-semibold text-gray-500 hover:text-gray-700';
            
            // Hide all content
            document.getElementById('contentPending').classList.add('hidden');
            document.getElementById('contentApproved').classList.add('hidden');
            document.getElementById('contentMahasiswa').classList.add('hidden');
            
            // Show active content
            if (tab === 'pending') {
                document.getElementById('tabPending').className = 'px-6 py-4 font-semibold border-b-2 border-indigo-600 text-indigo-600';
                document.getElementById('contentPending').classList.remove('hidden');
            } else if (tab === 'approved') {
                document.getElementById('tabApproved').className = 'px-6 py-4 font-semibold border-b-2 border-indigo-600 text-indigo-600';
                document.getElementById('contentApproved').classList.remove('hidden');
            } else if (tab === 'mahasiswa') {
                document.getElementById('tabMahasiswa').className = 'px-6 py-4 font-semibold border-b-2 border-indigo-600 text-indigo-600';
                document.getElementById('contentMahasiswa').classList.remove('hidden');
            }
        }
        
        // Get Pending Dosen
        async function getPendingDosen() {
            const keys = await StorageManager.list('user:dosen:');
            const pending = [];
            
            for (const key of keys) {
                const dosen = await StorageManager.get(key);
                if (dosen && !dosen.approved) {
                    pending.push(dosen);
                }
            }
            
            return pending;
        }
        
        // Get Approved Dosen
        async function getApprovedDosen() {
            const keys = await StorageManager.list('user:dosen:');
            const approved = [];
            
            for (const key of keys) {
                const dosen = await StorageManager.get(key);
                if (dosen && dosen.approved) {
                    approved.push(dosen);
                }
            }
            
            return approved;
        }
        
        // Get All Mahasiswa
        async function getAllMahasiswa() {
            const keys = await StorageManager.list('user:mahasiswa:');
            const mahasiswa = [];
            
            for (const key of keys) {
                const mhs = await StorageManager.get(key);
                if (mhs) {
                    mahasiswa.push(mhs);
                }
            }
            
            return mahasiswa;
        }
        
        // Approve Dosen
        async function approveDosen(nidn) {
            if (!confirm('Apakah Anda yakin ingin menyetujui dosen ini?')) {
                return;
            }
            
            showLoading();
            const dosen = await StorageManager.get('user:dosen:' + nidn);
            
            if (dosen) {
                dosen.approved = true;
                await StorageManager.set('user:dosen:' + nidn, dosen);
                alert('Dosen berhasil disetujui!');
                loadData();
            }
            
            hideLoading();
        }
        
        // Reject Dosen
        async function rejectDosen(nidn) {
            if (!confirm('Apakah Anda yakin ingin menolak dosen ini? Data akan dihapus permanen.')) {
                return;
            }
            
            showLoading();
            await StorageManager.delete('user:dosen:' + nidn);
            alert('Dosen berhasil ditolak dan dihapus!');
            loadData();
            hideLoading();
        }
        
        // Delete Approved Dosen
        async function deleteDosen(nidn) {
            if (!confirm('Apakah Anda yakin ingin menghapus dosen ini? Data akan dihapus permanen.')) {
                return;
            }
            
            showLoading();
            await StorageManager.delete('user:dosen:' + nidn);
            alert('Dosen berhasil dihapus!');
            loadData();
            hideLoading();
        }
        
        // Delete Mahasiswa
        async function deleteMahasiswa(npm) {
            if (!confirm('Apakah Anda yakin ingin menghapus mahasiswa ini? Data akan dihapus permanen.')) {
                return;
            }
            
            showLoading();
            await StorageManager.delete('user:mahasiswa:' + npm);
            alert('Mahasiswa berhasil dihapus!');
            loadData();
            hideLoading();
        }
        
        // Render Pending List
        function renderPendingList(pending) {
            const container = document.getElementById('pendingList');
            
            if (pending.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-gray-500">
                        <div class="text-6xl mb-4">📭</div>
                        <p class="text-xl">Tidak ada dosen yang menunggu persetujuan</p>
                    </div>
                `;
                return;
            }
            
            let html = '<div class="space-y-4">';
            pending.forEach(dosen => {
                html += `
                    <div class="border rounded-lg p-4 flex justify-between items-center hover:shadow-md transition">
                        <div>
                            <p class="font-bold text-lg">${dosen.nama}</p>
                            <p class="text-gray-600">NIDN: ${dosen.nidn}</p>
                            <p class="text-sm text-gray-500">Terdaftar: ${formatTanggal(dosen.createdAt)}</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="approveDosen('${dosen.nidn}')" class="btn-success">
                                ✓ Setujui
                            </button>
                            <button onclick="rejectDosen('${dosen.nidn}')" class="btn-danger">
                                ✗ Tolak
                            </button>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            
            container.innerHTML = html;
        }
        
        // Render Approved List
        function renderApprovedList(approved) {
            const container = document.getElementById('approvedList');
            
            if (approved.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-gray-500">
                        <div class="text-6xl mb-4">📭</div>
                        <p class="text-xl">Belum ada dosen yang disetujui</p>
                    </div>
                `;
                return;
            }
            
            let html = '<div class="overflow-x-auto"><table class="data-table">';
            html += `
                <thead>
                    <tr>
                        <th>No</th>
                        <th>NIDN</th>
                        <th>Nama</th>
                        <th>Tanggal Daftar</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody>
            `;
            
            approved.forEach((dosen, index) => {
                html += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${dosen.nidn}</td>
                        <td>${dosen.nama}</td>
                        <td>${formatTanggal(dosen.createdAt)}</td>
                        <td>
                            <button onclick="deleteDosen('${dosen.nidn}')" class="text-red-600 hover:text-red-800 font-semibold">
                                🗑️ Hapus
                            </button>
                        </td>
                    </tr>
                `;
            });
            
            html += '</tbody></table></div>';
            container.innerHTML = html;
        }
        
        // Render Mahasiswa List
        function renderMahasiswaList(mahasiswa) {
            const container = document.getElementById('mahasiswaList');
            
            if (mahasiswa.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-gray-500">
                        <div class="text-6xl mb-4">📭</div>
                        <p class="text-xl">Belum ada mahasiswa terdaftar</p>
                    </div>
                `;
                return;
            }
            
            let html = '<div class="overflow-x-auto"><table class="data-table">';
            html += `
                <thead>
                    <tr>
                        <th>No</th>
                        <th>NPM</th>
                        <th>Nama</th>
                        <th>Kelas</th>
                        <th>Tanggal Daftar</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody>
            `;
            
            mahasiswa.forEach((mhs, index) => {
                html += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${mhs.npm}</td>
                        <td>${mhs.nama}</td>
                        <td><span class="badge badge-info">${mhs.kelas}</span></td>
                        <td>${formatTanggal(mhs.createdAt)}</td>
                        <td>
                            <button onclick="deleteMahasiswa('${mhs.npm}')" class="text-red-600 hover:text-red-800 font-semibold">
                                🗑️ Hapus
                            </button>
                        </td>
                    </tr>
                `;
            });
            
            html += '</tbody></table></div>';
            container.innerHTML = html;
        }
        
        // Load All Data
        async function loadData() {
            showLoading();
            
            const pending = await getPendingDosen();
            const approved = await getApprovedDosen();
            const mahasiswa = await getAllMahasiswa();
            
            // Update stats
            document.getElementById('pendingCount').textContent = pending.length;
            document.getElementById('approvedCount').textContent = approved.length;
            document.getElementById('mahasiswaCount').textContent = mahasiswa.length;
            
            // Render lists
            renderPendingList(pending);
            renderApprovedList(approved);
            renderMahasiswaList(mahasiswa);
            
            hideLoading();
        }
        
        // Initial load
        loadData();
    </script>
    
</body>
</html>
